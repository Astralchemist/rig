name: Release

# Publish to npm + cut a GitHub Release when a version tag is pushed.
# Flow: bump package.json → merge to main → `git tag vX.Y.Z && git push origin vX.Y.Z`.
#
# Auth: npm trusted publishing (OIDC) once the package's trusted publisher is
# registered on npmjs.com (package → Settings → Trusted publishing → GitHub
# Actions: Astralchemist/rig, workflow release.yml). npm then mints a
# short-lived token from this job's OIDC identity, and no secret is needed.
# Until then npm falls back to the NPM_TOKEN repo secret. Either way the
# tarball is published with a provenance attestation.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions:
  contents: write # cut the GitHub Release
  id-token: write # npm trusted publishing + provenance

jobs:
  publish:
    name: publish to npm + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.1"

      - name: Setup Node (registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Use npm 11
        run: npm install -g npm@^11.5.1

      - name: Install
        run: bun install --frozen-lockfile

      # The prepublishOnly gate runs the full test suite, which includes
      # pre-commit-hook.test.ts — that asserts the hook is installed.
      - name: Install git hooks
        run: bun run install:hooks

      # Guard: a v0.1.5 tag must match package.json 0.1.5, so a mistagged push
      # can never publish the wrong version.
      - name: Tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != package.json $PKG"; exit 1; }

      # `npm publish` runs prepublishOnly (build + typecheck + tests + gen:check
      # + compat + migrations) before uploading, so the gate is enforced here too.
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
