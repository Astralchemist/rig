name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: gates + tests (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.1"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install git hooks
        run: bun run install:hooks

      - name: Generate embedded wasm
        # wasm-embedded.ts is gitignored — generated from node_modules at build
        # time. grammars.ts imports it, so typecheck and tests need it present.
        run: bun run gen:wasm

      - name: generated/ is fresh
        run: bun run gen:check

      - name: tool-surface compatibility
        run: bun run check:compat

      - name: shipped migrations unchanged
        run: bun run check:migrations

      - name: typecheck
        run: bun run typecheck

      - name: tests
        run: bun test

  node-matrix:
    name: node fallback (${{ matrix.os }} · node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.1"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (incl. better-sqlite3 fallback)
        run: bun install --frozen-lockfile
      - name: Build the CLI (bundles wasm + dist/rig.js)
        run: bun run build:cli
      # Prove the published Node path end-to-end on every OS: the better-sqlite3
      # native fallback, extraction, and on-device embeddings must all work
      # without Bun present at runtime.
      - name: init + index a fixture under Node
        shell: bash
        run: |
          work="$RUNNER_TEMP/rig-ci"
          mkdir -p "$work" && cd "$work"
          printf 'export function add(a,b){return a+b}\n' > a.js
          printf 'import {add} from "./a.js"\nexport const two = add(1,1)\n' > b.js
          node "$GITHUB_WORKSPACE/dist/rig.js" init
          node "$GITHUB_WORKSPACE/dist/rig.js" index
          node "$GITHUB_WORKSPACE/dist/rig.js" status

  pack-smoke:
    name: pack + install smoke (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build web UI + CLI bundle (as prepublishOnly does)
        run: bun run build
      - name: Pack
        run: npm pack
      # Install the real tarball into a clean project and drive it under Node —
      # exercises the bundle load, the better-sqlite3 DB path, wasm extraction,
      # and asset resolution in the published node_modules/rig layout.
      - name: Install tarball + run under Node
        run: |
          set -euo pipefail
          DIR="$(mktemp -d)"
          cd "$DIR"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/rig-*.tgz
          node node_modules/.bin/rig --version
          mkdir proj
          # shellcheck disable=SC2016 # literal TS template string, not shell
          printf 'export function greet(n: string){ return `hi ${n}`; }\n' > proj/a.ts
          cd proj
          node ../node_modules/.bin/rig init
          node ../node_modules/.bin/rig index | tee index.txt
          node ../node_modules/.bin/rig status
          # Extraction must have produced code nodes, not just exited 0.
          grep -Eq '^ *nodes: +[1-9]' index.txt

  e2e:
    name: e2e (playwright · chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.1"
      # The Playwright runner runs under Node; the server under test runs on Bun.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Generate embedded wasm
        # e2e/seed-and-serve.ts indexes a fixture project, which needs the grammars.
        run: bun run gen:wasm
      - name: Build the web UI
        run: bun run build:web
      - name: Install chromium
        run: bunx playwright install --with-deps chromium
      - name: e2e
        run: bun run test:e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
