name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: gates + tests (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.1"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install git hooks
        run: bun run install:hooks

      - name: Generate embedded wasm
        # wasm-embedded.ts is gitignored — generated from node_modules at build
        # time. grammars.ts imports it, so the test run needs it present.
        run: bun run gen:wasm

      - name: generated/ is fresh
        run: bun run gen:check

      - name: tool-surface compatibility
        run: bun run check:compat

      - name: shipped migrations unchanged
        run: bun run check:migrations

      - name: tests
        run: bun test

  pack-smoke:
    name: pack + install smoke (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build CLI bundle
        run: bun run build:cli
      - name: Pack
        run: npm pack
      # Install the real tarball into a clean project and drive it under Node —
      # exercises the bundle load, the better-sqlite3 DB path, wasm extraction,
      # and asset resolution in the published node_modules/rig layout.
      - name: Install tarball + run under Node
        run: |
          set -euo pipefail
          DIR="$(mktemp -d)"
          cd "$DIR"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/rig-*.tgz
          node node_modules/.bin/rig --version
          mkdir proj
          printf 'export function greet(n: string){ return `hi ${n}`; }\n' > proj/a.ts
          cd proj
          node ../node_modules/.bin/rig init
          node ../node_modules/.bin/rig index
