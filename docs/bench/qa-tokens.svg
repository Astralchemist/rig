<svg xmlns="http://www.w3.org/2000/svg" width="760" height="478" viewBox="0 0 760 478" role="img" aria-labelledby="qa-tokens-title qa-tokens-desc">
<title id="qa-tokens-title">Single-shot Q&amp;A: tokens relative to grep-only, anthropic/claude-haiku-5.5</title>
<desc id="qa-tokens-desc">Single-shot Q&amp;A, anthropic/claude-haiku-5.5: tokens per question relative to grep-only (median over questions of the arm's median tokens divided by grep-only's), by rig build and arm. 100% means the same cost as grep-only; above means more tokens. rig 0.2.0: rig 175.1% overall, lookup 301.1%, natural-language 135.3%, 43/48 correct vs grep-only 48/48; rig-search 161.2% overall, lookup 155.5%, natural-language 271.3%, 41/48 correct vs grep-only 48/48; grep+rig 152.6% overall, lookup 190.3%, natural-language 125.0%, 47/48 correct vs grep-only 47/48. rig 0.2.0 + hybrid search: rig 268.4% overall, lookup 245.5%, natural-language 294.3%, 44/48 correct vs grep-only 48/48; rig-search 131.5% overall, lookup 178.0%, natural-language 84.4%, 46/48 correct vs grep-only 48/48; grep+rig 125.8% overall, lookup 148.5%, natural-language 107.2%, 47/48 correct vs grep-only 48/48. rig 0.3.0 + orientation map: grep+rig 133.6% overall, lookup 175.0%, natural-language 99.3%, 48/48 correct vs grep-only 48/48; grep+rig+map 187.2% overall, lookup 203.4%, natural-language 128.2%, 48/48 correct vs grep-only 48/48.</desc>
<style>
svg{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,0.10);--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
@media (prefers-color-scheme: dark){svg{--bg:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,0.10);--s1:#3987e5;--s2:#d95926;--s3:#199e70}}
text{font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:12px;fill:var(--ink2)}
.bg{fill:var(--bg);stroke:var(--border)}
.title{font-size:15px;font-weight:600;fill:var(--ink)}
.sub{fill:var(--ink2)}
.head{font-weight:600;fill:var(--ink)}
.lab{fill:var(--ink)}
.val{fill:var(--ink2);font-variant-numeric:tabular-nums}
.tick{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:11px;fill:var(--muted)}
.empty{font-size:11px;fill:var(--muted);font-style:italic}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.ref{stroke:var(--ink2);stroke-width:1.5}
.hit{fill:transparent}
.ring{stroke:var(--bg);stroke-width:2}
.f-s1{fill:var(--s1)}
.w-s1{stroke:var(--s1);stroke-width:2;stroke-linecap:round;fill:none}
.f-s2{fill:var(--s2)}
.w-s2{stroke:var(--s2);stroke-width:2;stroke-linecap:round;fill:none}
.f-s3{fill:var(--s3)}
.w-s3{stroke:var(--s3);stroke-width:2;stroke-linecap:round;fill:none}
.f-muted{fill:var(--muted)}
.w-muted{stroke:var(--muted);stroke-width:2;stroke-linecap:round;fill:none}
</style>
<rect x="0.5" y="0.5" width="759" height="477" rx="8" class="bg"/>
<text x="24" y="32" class="title">Single-shot Q&amp;A: tokens relative to grep-only, anthropic/claude-haiku-5.5</text>
<text x="24" y="52" class="sub">Per question: arm median tokens ÷ grep-only median tokens; the dot is the median over questions. Left of 100% is cheaper.</text>
<circle cx="29" cy="74" r="5" class="f-s1 ring"/>
<text x="39" y="78" class="lab">all 16 questions</text>
<circle cx="168.4" cy="74" r="5" class="f-s2 ring"/>
<text x="178.4" y="78" class="lab">lookup questions (10)</text>
<circle cx="339.8" cy="74" r="5" class="f-s3 ring"/>
<text x="349.8" y="78" class="lab">natural-language questions (6)</text>
<text x="580" y="102" class="note">all · correct (arm, grep)</text>
<line x1="200" y1="108" x2="200" y2="426" class="grid"/><text x="200" y="441" class="tick" text-anchor="middle">0%</text><line x1="251.43" y1="108" x2="251.43" y2="426" class="grid"/><text x="251.43" y="441" class="tick" text-anchor="middle">50%</text><line x1="302.86" y1="108" x2="302.86" y2="426" class="grid"/><text x="302.86" y="441" class="tick" text-anchor="middle">100%</text><line x1="354.29" y1="108" x2="354.29" y2="426" class="grid"/><text x="354.29" y="441" class="tick" text-anchor="middle">150%</text><line x1="405.71" y1="108" x2="405.71" y2="426" class="grid"/><text x="405.71" y="441" class="tick" text-anchor="middle">200%</text><line x1="457.14" y1="108" x2="457.14" y2="426" class="grid"/><text x="457.14" y="441" class="tick" text-anchor="middle">250%</text><line x1="508.57" y1="108" x2="508.57" y2="426" class="grid"/><text x="508.57" y="441" class="tick" text-anchor="middle">300%</text><line x1="560" y1="108" x2="560" y2="426" class="grid"/><text x="560" y="441" class="tick" text-anchor="middle">350%</text>
<line x1="302.86" y1="104" x2="302.86" y2="426" class="ref"/>
<text x="306.86" y="102" class="note">grep-only = 100%</text>
