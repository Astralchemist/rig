<g><title>rig 0.2.0, rig (run 0.2.0-baseline): all 175.1%, lookup 301.1%, natural-language 135.3%; correct 43/48 vs grep-only 48/48</title><rect x="24" y="134" width="712" height="30" class="hit"/></g>
<text x="36" y="179" class="lab" dominant-baseline="middle">rig-search</text>
