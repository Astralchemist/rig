<svg xmlns="http://www.w3.org/2000/svg" width="760" height="442" viewBox="0 0 760 442" role="img" aria-labelledby="cross-model-title cross-model-desc">
<title id="cross-model-title">Across models: memory gain and Q&amp;A token cost</title>
<desc id="cross-model-desc">Per model: session-2 memory gain (memory-on minus memory-off, 95% CI) and single-shot grep+rig tokens relative to grep-only. anthropic/claude-haiku-5.5 (low-cost): memory +40.0 pp (95% CI +20.0 to +60.0 pp), PASS against the bar; Q&amp;A 133.6% of grep-only tokens. openai/gpt-6-luna (low-cost): memory not run yet; Q&amp;A not run yet. deepseek/deepseek-v4.1-flash (low-cost): memory +60.0 pp (95% CI +40.0 to +78.3 pp), FAIL against the bar; Q&amp;A not run yet. qwen/qwen3.8-flash (low-cost): memory not run yet; Q&amp;A not run yet. google/gemini-3.8-flash (low-cost): memory not run yet; Q&amp;A not run yet. anthropic/claude-sonnet-5.5 (frontier): memory not run yet; Q&amp;A not run yet. openai/gpt-6.1-sol (frontier): memory not run yet; Q&amp;A not run yet. google/gemini-4-argon (frontier): memory not run yet; Q&amp;A not run yet.</desc>
<style>
svg{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,0.10);--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
@media (prefers-color-scheme: dark){svg{--bg:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,0.10);--s1:#3987e5;--s2:#d95926;--s3:#199e70}}
text{font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:12px;fill:var(--ink2)}
.bg{fill:var(--bg);stroke:var(--border)}
.title{font-size:15px;font-weight:600;fill:var(--ink)}
.sub{fill:var(--ink2)}
.head{font-weight:600;fill:var(--ink)}
.lab{fill:var(--ink)}
.val{fill:var(--ink2);font-variant-numeric:tabular-nums}
.tick{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:11px;fill:var(--muted)}
.empty{font-size:11px;fill:var(--muted);font-style:italic}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.ref{stroke:var(--ink2);stroke-width:1.5}
.hit{fill:transparent}
.ring{stroke:var(--bg);stroke-width:2}
.f-s1{fill:var(--s1)}
.w-s1{stroke:var(--s1);stroke-width:2;stroke-linecap:round;fill:none}
.f-s2{fill:var(--s2)}
.w-s2{stroke:var(--s2);stroke-width:2;stroke-linecap:round;fill:none}
.f-s3{fill:var(--s3)}
.w-s3{stroke:var(--s3);stroke-width:2;stroke-linecap:round;fill:none}
.f-muted{fill:var(--muted)}
.w-muted{stroke:var(--muted);stroke-width:2;stroke-linecap:round;fill:none}
</style>
