<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rig — Local-First Knowledge Graph</title>
    <script>
      // Stamp the theme before first paint (also on the sign-in gate, which
      // can't read .rig/config.json yet). theme.tsx keeps it in sync after.
      (function () {
        var id = 'system';
        try { id = localStorage.getItem('rig.theme') || 'system'; } catch (e) {}
        var known = { observatory: 1, warm: 1, nebula: 1, light: 1 };
        if (!known[id]) id = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'observatory';
        document.documentElement.dataset.theme = id;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
